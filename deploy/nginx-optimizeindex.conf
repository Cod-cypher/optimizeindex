# /etc/nginx/sites-available/optimizeindex.conf
# Certbot will add the SSL server block automatically when you run:
#   certbot --nginx -d optimizeindex.com -d www.optimizeindex.com

# Compression. Debian/Ubuntu's default nginx.conf sets `gzip on` but its
# default gzip_types covers text/html only — which meant the ~380 KB JS bundle
# and 53 KB stylesheet went over the wire uncompressed. The Node app also runs
# `compression` middleware, so this is belt-and-braces; keep both, since
# whichever layer handles the response should compress it.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml font/woff2;

server {
    listen 80;
    listen [::]:80;
    # www is handled by the redirect block at the bottom of this file. Listing
    # it here as well would be a duplicate exact server_name — nginx warns
    # "conflicting server name" and silently keeps only the first block, so the
    # redirect would never run.
    server_name optimizeindex.com;

    # Node app started by PM2 (PORT in ecosystem.config.cjs)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Long cache for hashed build assets and self-hosted fonts.
    # The Node app sets Cache-Control itself now, so don't add a second header
    # here — nginx `add_header` appends rather than replaces, and two
    # Cache-Control values on one response is undefined behaviour.
    location ~* ^/(assets|fonts)/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }
}

# www -> apex, 301.
#
# The block above serves both hostnames identically, so every page was
# reachable at two URLs and split its own ranking signals. The Node app also
# performs this redirect (see the canonical-host middleware in server.ts), so
# the site is correct either way — doing it here just saves a proxy hop.
#
# Note: certbot's --nginx redirect option only handles http -> https. It does
# not deduplicate the hostname.
server {
    listen 80;
    listen [::]:80;
    server_name www.optimizeindex.com;
    return 301 http://optimizeindex.com$request_uri;
}
