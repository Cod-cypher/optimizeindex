# /etc/nginx/sites-available/00-default-server.conf
#
# Catch-all for requests whose Host header names none of this box's sites:
# the bare IP (http://167.233.120.70/), a stray domain pointed at it, or a
# scanner sending no Host at all. Without a default_server, nginx hands those
# to the FIRST server block it loaded for the port, which served
# optimizeindex.com's pages at 200 under a hostname that is not ours.
#
# This file is server-wide, not part of optimizeindex.conf, for two reasons:
#   - it applies to every site on the box (sujoodmats too), and a port can have
#     only one default_server;
#   - certbot never edits it (it holds no certificate), so unlike
#     optimizeindex.conf it is safe to copy from the repo on every deploy.
#
# BEFORE INSTALLING, check that nothing else already claims default_server:
#
#   grep -rn default_server /etc/nginx/sites-enabled/ /etc/nginx/conf.d/
#
# Ubuntu's stock /etc/nginx/sites-enabled/default does (`listen 80
# default_server`). A second default_server on the same port makes `nginx -t`
# fail with "a duplicate default server", so remove that symlink first:
#
#   rm /etc/nginx/sites-enabled/default
#
# If another site on this box is meant to answer its bare IP, do not install
# this file without deciding which wins.
#
# `ssl_reject_handshake` needs nginx 1.19.4 or later (`nginx -v`). On older
# nginx, leave the 443 block out rather than giving it a certificate for a
# hostname it does not serve.

# Port 80: close the connection without a response. 444 is nginx's
# non-standard "no response" code; curl reports "Empty reply from server".
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Port 443: refuse the TLS handshake for any SNI name no site claims, so no
# certificate is presented and nothing is served.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
